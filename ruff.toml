include = ["tests/**/*.py", "python/**/*.py"]
line-length = 120

[lint]
select = ["E", "W", "F", "I", "UP", "B", "PT"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "PT006", # comma-separated parametrize names are the project convention
]

[format]
quote-style = "double"
indent-style = "space"
